# Gate de seguridad - Azure DevOps (primario)
#
# El BLOQUEO real no lo da este YAML, sino:
#   1. Branch policy -> Build validation: marca este pipeline como REQUERIDO en la rama protegida.
#   2. (Despliegue) Environment -> Approvals and checks: aprobacion + atestacion firmada.
# Configura ambos desde la UI de Azure DevOps y restringe quien puede editarlos.

trigger: none          # el gate corre en PR, no en push directo

pr:
  branches:
    include:
      - main
      - release/*

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - script: |
      set -e
      python -m pip install --quiet semgrep || true
      # gitleaks es opcional; si esta disponible en la imagen, se usa automaticamente
      echo "PREVIEW_URL=${PREVIEW_URL:-<sin preview>}"
    displayName: "Preparar herramientas (semgrep/gitleaks)"

  - script: |
      set -e
      bash security/checks/run_all.sh
    displayName: "Gate de seguridad (politica de aplicaciones)"
    env:
      # Para proyectos APP: publica un preview y pasa su URL para que el check de cabeceras aplique.
      PREVIEW_URL: $(PREVIEW_URL)
