name: Gate de seguridad

# Replica de azure-pipelines.yml para GitHub, que es donde vive este repositorio.
#
# El BLOQUEO real no lo da este workflow, sino la PROTECCION DE RAMA:
#   Settings -> Branches -> Require status checks -> marcar "gate" como requerido.
# Sin ese paso, esto es un aviso, no una barrera.

on:
  pull_request:
    branches:
      - main
      - 'release/*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Politica de seguridad de aplicaciones
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # semgrep NO es opcional desde que el repositorio tiene sus propias reglas
      # en security/.semgrep.yml: sin el, check_sast.sh cae al modo heuristico,
      # que es ciego a la clase de riesgo de este proyecto (ver el §5 del
      # informe de cumplimiento). Que se degrade en silencio seria peor que
      # fallar, asi que si no se puede instalar, el gate se cae aqui.
      - name: Preparar herramientas (semgrep / gitleaks)
        run: |
          python -m pip install --quiet semgrep
          semgrep --version
          # gitleaks es opcional; si esta disponible, check_secrets.sh lo usa solo.

      - name: Gate de seguridad
        run: bash security/checks/run_all.sh
        env:
          # Este sitio es estatico y no publica un preview, asi que la variable
          # va vacia y el check de cabeceras se salta. Consecuencia declarada en
          # security/compliance-report.md: los controles HDR quedan fuera de la
          # verificacion automatica y se registran como "Activa" en la
          # atestacion hasta que el alojamiento permita cabeceras.
          PREVIEW_URL: ${{ vars.PREVIEW_URL }}
