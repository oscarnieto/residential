name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/clever-brahmagupta-abt3is
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # El HTML se genera desde content/*.json. Se reconstruye siempre, de modo
      # que lo publicado corresponde al contenido aunque el HTML versionado se
      # hubiera quedado atrás (por ejemplo tras editar desde /admin).
      - name: Build site
        run: node build/build.mjs

      # Si el build ha cambiado algo, se devuelve al repositorio para que el
      # HTML versionado siga coincidiendo con el contenido. Los push hechos con
      # GITHUB_TOKEN no vuelven a disparar workflows, así que no hay bucle.
      - name: Commit generated HTML
        run: |
          if [ -n "$(git status --porcelain -- '*.html' css/theme.css)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.html' css/theme.css
            git commit -m "Regenerar HTML desde el contenido"
            git push
          else
            echo "El HTML generado ya estaba al día."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
