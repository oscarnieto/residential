<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <!--
    HDR-02 · Política de seguridad de contenidos del panel.

    Va en <meta> porque GitHub Pages no permite cabeceras. Tres directivas
    difieren de las de la web pública y no se pueden apretar más:
      · connect-src  el panel habla con la API de GitHub (admin/js/github.js).
      · frame-src    la vista previa es un iframe `srcdoc` del mismo origen.
      · base-uri     esa vista previa inyecta un <base> para resolver los
                     assets dentro del iframe; con 'none' se quedaría en blanco.
    `frame-ancestors` se ignora en <meta>: el anti-enmarcado lo hace
    js/antiframe.js. Ver security/compliance-report.md.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; media-src 'self'; font-src 'self'; connect-src 'self' https://api.github.com; object-src 'none'; form-action 'none'; frame-src 'self'; base-uri 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Gestor de contenidos | Obra Nueva Residencial</title>
  <script src="js/antiframe.js"></script>
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <link rel="stylesheet" href="../css/fonts.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div id="root">
    <div class="loading">
      <div class="spinner spinner--dark"></div>
      <p>Cargando el gestor…</p>
    </div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
